services:
  statistiques-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: statistiques
      POSTGRES_USER: statistiques
      POSTGRES_PASSWORD: statistiques
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - statistiques-dev-data:/var/lib/postgresql/data

volumes:
  statistiques-dev-data: {}
